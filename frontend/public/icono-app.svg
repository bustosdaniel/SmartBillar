<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <!-- Ícono de la app instalada (PWA). Fondo a sangre: iOS y Android le redondean las esquinas.
       El logo ocupa el 64% central, dentro de la zona segura de los íconos "maskable" de Android. -->
  <rect width="512" height="512" fill="#0F3D2E"/>
  <g transform="translate(92 92) scale(5.125)">
    <g stroke="#22C55E" stroke-width="4" stroke-linecap="round">
      <line x1="6" y1="6" x2="58" y2="58"/>
      <line x1="58" y1="6" x2="6" y2="58"/>
    </g>
    <circle cx="32" cy="32" r="20" fill="#0B0F0D" stroke="#22C55E" stroke-width="3"/>
    <circle cx="32" cy="32" r="9" fill="#F5F5F4"/>
    <text x="32" y="36.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="13" fill="#0B0F0D">8</text>
  </g>
</svg>
